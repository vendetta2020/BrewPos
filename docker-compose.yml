services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brewpos-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      APP_NAME: BrewPOS
      APP_ENV: local
      APP_KEY: base64:YkBlp/CG1Ey7YljiQvfz5z0lAmtl0SlybGwiLobRPWE=
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: brewpos
      DB_USERNAME: root
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: brewpos-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: brewpos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: brewpos
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - brewpos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -psecret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: brewpos-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  brewpos_mysql_data:
